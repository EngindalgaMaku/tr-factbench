name: TR-FactBench Validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn numpy pandas matplotlib seaborn scipy
      - name: Compile Python sources
        run: python -m compileall -q scripts src annotation
      - name: Preflight
        run: python scripts/00_preflight.py
      - name: Rebuild deterministic derived splits
        run: python scripts/04_build_derived_splits.py
      - name: Validate run artifacts
        run: python scripts/14_validate_runs.py
      - name: Rebuild canonical outputs
        run: |
          python scripts/13_collect_results.py
          python scripts/15_generate_tables.py
          python scripts/16_generate_statistics.py
          python scripts/18_generate_figures.py
          python scripts/21_a2_data_effect_analysis.py
          python scripts/23_d1_five_seed_report.py
          python scripts/26_electra_rank_figure.py
          python scripts/28_canonical_report.py
          python scripts/29_statistical_tests.py
          python scripts/30_collapse_analysis.py
          python scripts/31_hp_grid_table.py
          python scripts/32_error_analysis.py
          python scripts/33_annotation_quality_report.py
          python scripts/35_generate_lock_yaml.py
          python scripts/37_final_dropout_report.py
          python scripts/17_aggregate_predictions.py
      - name: Check no uncommitted generated file changes
        run: |
          git diff --exit-code -- \
            results/csv/ results/statistics/ results/tables/ results/predictions/ \
            reports/BENCHMARK_RESULTS.md reports/validation_audit.json \
            data/checksums.sha256 || {
            echo "ERROR: Generated files differ from committed state. Re-run pipeline scripts and commit."
            exit 1
          }
      - name: Release invariants
        run: python scripts/99_validate_release.py
      - name: Verify checksums
        run: |
          python scripts/_update_checksums.py
          git diff --exit-code data/checksums.sha256 || {
            echo "ERROR: checksums.sha256 out of date."
            exit 1
          }
